services:
  # ── Backend FastAPI (Web Service) ────────────────────────────────────────
  - type: web
    name: kobo-automation-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Kobo Automation Suite
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: production
      # URL de la base de données PostgreSQL Neon (à renseigner dans le dashboard Render)
      - key: DATABASE_URL
        sync: false          # Ex: postgresql://neondb_owner:password@ep-xyz.eu-central-1.aws.neon.tech/neondb?sslmode=require
      # ⚠️ À renseigner lors de la création du Blueprint ou dans les variables d'environnement
      - key: SECRET_KEY
        sync: false          # Clé Fernet (base64)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false          # Ex: https://kobo-automation-frontend.onrender.com/google-callback
      - key: ALLOWED_ORIGINS
        sync: false          # Ex: https://kobo-automation-frontend.onrender.com

  # ── Frontend React/Vite (Site Statique distribué via CDN mondial) ────────
  - type: web
    name: kobo-automation-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # Ex: https://kobo-automation-backend.onrender.com/api
