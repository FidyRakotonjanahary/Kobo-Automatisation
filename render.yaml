databases:
  # ── Base de Données PostgreSQL Persistante ───────────────────────────────
  - name: kobo-automation-db
    region: frankfurt   # Même région que les services
    plan: free
    databaseName: kobo_db
    user: kobo_user

services:
  # ── Backend FastAPI ──────────────────────────────────────────────────────
  - type: web
    name: kobo-automation-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Kobo Automation Suite
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: production
      # Connexion automatique à PostgreSQL Render
      - key: DATABASE_URL
        fromDatabase:
          name: kobo-automation-db
          property: connectionString
      # ⚠️ À renseigner lors de la création du Blueprint ou dans les variables d'environnement
      - key: SECRET_KEY
        sync: false          # Clé Fernet (base64)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false          # Ex: https://kobo-automation-frontend.onrender.com/google-callback
      - key: ALLOWED_ORIGINS
        sync: false          # Ex: https://kobo-automation-frontend.onrender.com

  # ── Frontend React/Vite (Site Statique) ──────────────────────────────────
  - type: web
    name: kobo-automation-frontend
    runtime: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # Ex: https://kobo-automation-backend.onrender.com/api
